<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>intro</title>
  <link rel="stylesheet" href="../base.css">
  <style>
    .meta {
      text-align: center;
      margin-bottom: 7vh;
    }
    .event {
      font-size: 3.4vh;
      letter-spacing: 0.18em;
    }
    .time {
      font-size: 2.4vh;
      margin-top: 1.2vh;
    }
    .rounds {
      font-size: 2.4vh;
      margin-top: 0.6vh;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="meta">
      <div class="event accent" id="event"></div>
      <div class="time muted" id="time"></div>
      <div class="rounds muted" id="rounds"></div>
    </div>
    <div class="teams" id="teams"></div>
  </div>

  <script src="../base.js"></script>
  <script>
    window.initScene = (data) => {
      document.getElementById('event').textContent = data.event || '';
      document.getElementById('time').textContent = data.time || '';
      document.getElementById('rounds').textContent =
        (data.totalRounds ? data.totalRounds + ' 回合 · ' : '') +
        'BO' + (data.mapCount || 0);

      const teamsEl = document.getElementById('teams');
      teamsEl.innerHTML = '';
      (data.teams || []).forEach((team, i) => {
        if (i > 0) {
          const vs = document.createElement('div');
          vs.className = 'versus';
          vs.textContent = 'vs';
          teamsEl.appendChild(vs);
        }
        const box = document.createElement('div');
        box.className = 'team';

        const name = document.createElement('div');
        name.className = 'name ' + (team.won ? 'win' : 'lose');
        name.textContent = team.name;

        const score = document.createElement('div');
        score.className = 'score ' + (team.won ? 'win' : 'lose');
        score.textContent = team.score;

        box.appendChild(name);
        box.appendChild(score);
        teamsEl.appendChild(box);
      });
    };

    /* M2：静态画面，无动画。 */
    window.renderFrame = (t) => {
      document.getElementById('scene').style.opacity = '1';
    };
  </script>
</body>
</html>
