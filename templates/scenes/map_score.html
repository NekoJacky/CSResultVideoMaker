<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>map_score</title>
  <link rel="stylesheet" href="../base.css">
  <style>
    .head {
      text-align: center;
      margin-bottom: 6vh;
    }
    .map-name {
      font-size: 6vh;
      font-weight: var(--heading-weight);
      letter-spacing: 0.04em;
    }
    .sub {
      font-size: 2.6vh;
      margin-top: 1vh;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="head">
      <div class="map-name accent" id="map-name"></div>
      <div class="sub muted" id="sub"></div>
    </div>
    <div class="teams" id="teams"></div>
  </div>

  <script src="../base.js"></script>
  <script>
    window.initScene = (data) => {
      document.getElementById('map-name').textContent = data.mapName || '';
      document.getElementById('sub').textContent =
        'Map ' + (data.index || 1) + ' / ' + (data.total || 1) +
        ' · ' + (data.rounds || 0) + ' 回合';

      const teamsEl = document.getElementById('teams');
      teamsEl.innerHTML = '';
      (data.teams || []).forEach((team, i) => {
        if (i > 0) {
          const vs = document.createElement('div');
          vs.className = 'versus';
          vs.textContent = 'vs';
          teamsEl.appendChild(vs);
        }
        const box = document.createElement('div');
        box.className = 'team';

        const name = document.createElement('div');
        name.className = 'name ' + (team.won ? 'win' : 'lose');
        name.textContent = team.name;

        const score = document.createElement('div');
        score.className = 'score ' + (team.won ? 'win' : 'lose');
        score.textContent = team.score;

        box.appendChild(name);
        box.appendChild(score);
        teamsEl.appendChild(box);
      });
    };

    window.renderFrame = (t) => {
      document.getElementById('scene').style.opacity = '1';
    };
  </script>
</body>
</html>
